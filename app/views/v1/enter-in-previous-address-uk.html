<!-- Use this page as the index for your project -->

<!-- ADDING CUSTOM CSS - Add your custom CSS or Sass in /app/assets/sass/main.scss -->

<!-- Extends the layout from /app/views/layout.html -->
{% extends 'layout.html' %}
<!--
  In /app/views/layout.html you can:
    - change the header and footer
    - add custom CSS and JavaScript
-->

<!--
  Use this to set the page name which will appear at the
  start of the <title> tag, followed by the service name.
  This is often not needed on the homepage, where only the
  service name is needed. You can also reuse this variable
  within the <h1>, where they are the same.
-->
{% set pageName = "" %}

<!-- For adding a breadcrumb or back link -->
<!-- Code examples can be found at https://service-manual.nhs.uk/design-system/components/breadcrumbs and https://service-manual.nhs.uk/design-system/components/back-link -->


<!-- For adding page content -->
<!-- Page layout code can be found at https://service-manual.nhs.uk/design-system/styles/layout -->
{% block content %}
<div class="nhsuk-grid-row">
  <div class="nhsuk-grid-column-two-thirds">

    <span class="nhsuk-caption-l nhsuk-caption--bottom">Your details</span>

    <form method="post" action="/v1/enter-in-previous-address-uk">

      <fieldset class="nhsuk-fieldset">
        <legend class="nhsuk-fieldset__legend nhsuk-fieldset__legend--xl">
          <h1 class="nhsuk-fieldset__heading">What is your previous address?</h1>
        </legend>

        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="previous-address-line-1">Address line 1</label>
          <input class="nhsuk-input" id="previous-address-line-1" name="previousAddressLine1" type="text" autocomplete="address-line1">
        </div>

        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="previous-address-line-2">Address line 2 (optional)</label>
          <input class="nhsuk-input" id="previous-address-line-2" name="previousAddressLine2" type="text" autocomplete="address-line2">
        </div>

        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="previous-address-town">Town or city</label>
          <input class="nhsuk-input nhsuk-u-width-two-thirds" id="previous-address-town" name="previousAddressTown" type="text" autocomplete="address-level2">
        </div>

        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="previous-address-county">County, province or region (optional)</label>
          <input class="nhsuk-input nhsuk-u-width-two-thirds" id="previous-address-county" name="previousAddressCounty" type="text">
        </div>

        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="previous-address-country">Country</label>
          <input class="nhsuk-input nhsuk-u-width-two-thirds" id="previous-address-country" name="previousAddressCountry" type="text" autocomplete="country-name">
        </div>

        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="previous-address-postcode">Postcode</label>
          <input class="nhsuk-input nhsuk-input--width-10" id="previous-address-postcode" name="previousAddressPostcode" type="text" spellcheck="false" autocomplete="postal-code">
        </div>
      </fieldset>

      <button class="nhsuk-button" data-module="nhsuk-button" type="submit">
        Continue
      </button>

    </form>

    <p><a href="enter-in-previous-address-not-uk">My address is not in the UK</a></p>

      
      
      


      

      

      

     

    </div>
  </div>
{% endblock %}
